name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  knip:
    name: Unused code & deps (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run knip (fail on any unused files, exports, or dependencies)
        run: bun run knip:ci
